<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boss Script Demo — Ending</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #fff;
    font-family: "Noto Sans", "Droid Sans", Arial, sans-serif;
  }

  .overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    pointer-events: auto;
    z-index: 9999;
    background: #000;
  }

  .overlay.hidden {
    display: none;
  }

  .title {
    position: absolute;
    top: 18px;
    left: 20px;
    font-size: 13px;
    letter-spacing: 0.15em;
    opacity: 0.5;
    pointer-events: none;
  }

  .story {
    position: absolute;
    bottom: 22px;
    left: 20px;
    right: 20px;
    font-size: 12px;
    opacity: 0.6;
    line-height: 1.5;
    pointer-events: none;
  }

  .video-frame {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    pointer-events: none;
  }

  .toc {
    position: fixed;
    bottom: 18px;
    left: 18px;
    right: 18px;
    display: flex;
    gap: 10px;
    pointer-events: auto;
    z-index: 10000;
  }

  .toc-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 12px 18px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.14);
    background: rgba(10,14,24,0.68);
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    text-align: center;
    cursor: pointer;
    backdrop-filter: blur(8px);
    transition: border-color 0.2s, background 0.2s, transform 0.15s;
  }

  .toc-btn:hover {
    border-color: rgba(255,255,255,0.35);
    background: rgba(244,196,48,0.12);
    transform: translateY(-1px);
  }

  .toc-btn:active {
    transform: translateY(0);
  }

  .toc-btn .label {
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.02em;
  }

  .toc-btn .sub {
    font-size: 11px;
    opacity: 0.65;
  }

  .playover {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    gap: 18px;
    pointer-events: auto;
    background: rgba(10,14,24,0.82);
    padding: 20px 28px;
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.15);
  }

  .playover-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 16px 24px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.18);
    background: rgba(10,14,24,0.72);
    color: #fff;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    backdrop-filter: blur(10px);
    transition: border-color 0.2s, transform 0.15s;
  }

  .playover-btn:hover {
    border-color: rgba(255,255,255,0.4);
    transform: translateY(-2px);
  }

  .playover-btn:active {
    transform: translateY(0);
  }

  .playover-btn .icon {
    font-size: 26px;
  }

  .playover-btn .name {
    font-size: 16px;
  }

  .playover-btn .sub {
    font-size: 11px;
    opacity: 0.65;
  }

  .close-btn {
    position: fixed;
    top: 14px;
    right: 14px;
    z-index: 10001;
    background: rgba(10,14,24,0.72);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 10px;
    padding: 9px 14px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    backdrop-filter: blur(10px);
    pointer-events: auto;
  }

  .close-btn:hover {
    border-color: rgba(255,255,255,0.4);
  }

  .toc-btn.active,
  .playover-btn.active {
    border-color: #f4c430;
    background: rgba(244,196,48,0.08);
  }

  .toc-btn.active .label,
  .playover-btn.active .name,
  .playover-btn.active .sub {
    color: #f4c430;
  }
</style>
</head>
<body>

  <div id="winScreen" class="overlay hidden">
    <div class="title">VICTORY</div>
    <video class="video-frame" controls playsinline>
      <source src="cutscene/Win.mp4" type="video/mp4">
    </video>
    <div class="story">Boss defeated. Title won.</div>
    <div class="toc">
      <button class="toc-btn" onclick="closeOverlay()">
        <span class="label">Continue</span>
        <span class="sub">Back to battle</span>
      </button>
    </div>
  </div>

  <div id="loseScreen" class="overlay hidden">
    <div class="title">DEFEAT</div>
    <video class="video-frame" controls playsinline>
      <source src="cutscene/Lose.mp4" type="video/mp4">
    </video>
    <div class="story">You failed. Fight again.</div>
    <div class="toc">
      <button class="toc-btn" onclick="closeOverlay()">
        <span class="label">Retry</span>
        <span class="sub">Back to battle</span>
      </button>
    </div>
  </div>

  <div id="playover" class="overlay">
    <div id="playoverTitle" class="title">Ending Menu</div>
    <div class="playover">
      <button class="playover-btn active" id="playWin" onclick="playWin()">
        <span class="icon">🏆</span>
        <span class="name">Victory</span>
        <span class="sub">Show Win.mp4</span>
      </button>
      <button class="playover-btn" id="playLose" onclick="playLose()">
        <span class="icon">💀</span>
        <span class="name">Defeat</span>
        <span class="sub">Show Lose.mp4</span>
      </button>
    </div>
    <button class="close-btn" onclick="closeOverlay()">Close</button>
  </div>

<script>
  var video = null;

  function openPlayover(title) {
    document.getElementById('playoverTitle').textContent = title || 'Ending Menu';
    document.getElementById('winScreen').classList.add('hidden');
    document.getElementById('loseScreen').classList.add('hidden');
    document.getElementById('playover').classList.remove('hidden');
    cleanVideo();
    document.getElementById('playWin').classList.add('active');
    document.getElementById('playLose').classList.remove('active');
  }

  function playWin() {
    cleanVideo();
    document.getElementById('playWin').classList.add('active');
    document.getElementById('playLose').classList.remove('active');
    var v = document.createElement('video');
    v.setAttribute('playsinline', '');
    v.setAttribute('autoplay', '');
    v.setAttribute('muted', '');
    v.setAttribute('loop', '');
    v.setAttribute('id', 'overlay-video');
    v.style.position = 'fixed';
    v.style.inset = '0';
    v.style.width = '100%';
    v.style.height = '100%';
    v.style.objectFit = 'cover';
    v.style.pointerEvents = 'none';
    v.style.zIndex = '9999';
    v.src = 'cutscene/Win.mp4';
    document.body.prepend(v);
    setTimeout(function () { v.play().catch(function () {}); }, 300);
    document.getElementById('playover').classList.add('hidden');
    document.getElementById('winScreen').classList.remove('hidden');
  }

  function playLose() {
    cleanVideo();
    document.getElementById('playLose').classList.add('active');
    document.getElementById('playWin').classList.remove('active');
    var v = document.createElement('video');
    v.setAttribute('playsinline', '');
    v.setAttribute('autoplay', '');
    v.setAttribute('muted', '');
    v.setAttribute('loop', '');
    v.setAttribute('id', 'overlay-video');
    v.style.position = 'fixed';
    v.style.inset = '0';
    v.style.width = '100%';
    v.style.height = '100%';
    v.style.objectFit = 'cover';
    v.style.pointerEvents = 'none';
    v.style.zIndex = '9999';
    v.src = 'cutscene/Lose.mp4';
    document.body.prepend(v);
    setTimeout(function () { v.play().catch(function () {}); }, 300);
    document.getElementById('playover').classList.add('hidden');
    document.getElementById('loseScreen').classList.remove('hidden');
  }

  function closeOverlay() {
    cleanVideo();
    document.getElementById('winScreen').classList.add('hidden');
    document.getElementById('loseScreen').classList.add('hidden');
    document.getElementById('playover').classList.remove('hidden');
    document.getElementById('playWin').classList.add('active');
    document.getElementById('playLose').classList.remove('active');
  }

  function cleanVideo() {
    var v = document.getElementById('overlay-video');
    if (v) {
      v.pause();
      v.src = '';
      v.load();
      v.remove();
    }
  }

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      closeOverlay();
    }
  });
</script>

</body>
</html>
