<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boss Script Demo — Ending</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #fff;
    font-family: "Noto Sans", "Droid Sans", Arial, sans-serif;
  }

  .overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    pointer-events: auto;
    z-index: 9999;
    background: #000;
  }

  .overlay.hidden {
    display: none;
  }

  .title {
    position: absolute;
    top: 18px;
    left: 20px;
    font-size: 13px;
    letter-spacing: 0.15em;
    opacity: 0.5;
    pointer-events: none;
  }

  .story {
    position: absolute;
    bottom: 22px;
    left: 20px;
    right: 20px;
    font-size: 12px;
    opacity: 0.6;
    line-height: 1.5;
    pointer-events: none;
  }

  .video-frame {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    pointer-events: none;
  }

  .toc {
    position: fixed;
    bottom: 18px;
    left: 18px;
    right: 18px;
    display: flex;
    gap: 10px;
    pointer-events: auto;
    z-index: 10000;
  }

  .toc-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 12px 18px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.14);
    background: rgba(10,14,24,0.68);
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    text-align: center;
    cursor: pointer;
    backdrop-filter: blur(8px);
    transition: border-color 0.2s, background 0.2s, transform 0.15s;
  }

  .toc-btn:hover {
    border-color: rgba(255,255,255,0.35);
    background: rgba(244,196,48,0.12);
    transform: translateY(-1px);
  }

  .toc-btn:active {
    transform: translateY(0);
  }

  .toc-btn .label {
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.02em;
  }

  .toc-btn .sub {
    font-size: 11px;
    opacity: 0.65;
  }
</style>
</head>
<body>

  <div id="winScreen" class="overlay hidden">
    <div class="title">DONE</div>
    <img class="video-frame" src="cutscene/Win.mp4" alt="" draggable="false">
    <div class="story">You win / lose. Continue back to battle.</div>
    <div class="toc">
      <button class="toc-btn" onclick="closeOverlay()">
        <span class="label">Continue</span>
        <span class="sub">Back to battle</span>
      </button>
    </div>
  </div>

<script>
  function closeOverlay() {
    var v = document.getElementById('overlay-video');
    if (v) {
      v.pause();
      v.src = '';
      v.load();
      v.remove();
    }
    document.getElementById('winScreen').classList.add('hidden');
    document.getElementById('loseScreen').classList.add('hidden');
    document.getElementById('playover').classList.add('hidden');
  }
</script>

</body>
</html>
